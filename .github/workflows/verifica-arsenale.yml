name: Verifica Arsenale IA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifica:
    name: Verifica ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifica procedure canoniche
        run: python Strumenti/verifica_procedure.py

      - name: Verifica adattatori
        run: python Strumenti/verifica_skills.py

      - name: Verifica evidenze operative
        run: python Strumenti/verifica_evidenze.py

      - name: Verifica soglia promozioni
        run: python Strumenti/verifica_promozioni.py

      - name: Test validatori
        run: python -m unittest Strumenti.test_verifica_evidenze Strumenti.test_verifica_promozioni

      - name: Prova installatore POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dest="$RUNNER_TEMP/arsenale-skills"
          sh Strumenti/installa-skills.sh custom "$dest"
          expected=$(find Procedure -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)
          count=$(find "$dest" -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$count" -eq "$expected"

      - name: Prova installatore PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "arsenale-skills"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          .\Strumenti\Installa-Skills.ps1 -Destinazione Personalizzato -Percorso $dest -Forza
          $expected = (Get-ChildItem -LiteralPath "Procedure" -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName "SKILL.md") }).Count
          $count = (Get-ChildItem -LiteralPath $dest -Directory).Count
          if ($count -ne $expected) {
              throw "Attese $expected skill installate, trovate $count"
          }
